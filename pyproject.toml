[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "react-usc"
dynamic = ["version"]
description = "ReAct + Universal Self-Consistency Agent - A LangGraph-based agent with parallel reasoning paths"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "React USC Contributors"}
]
keywords = ["ai", "agent", "react", "self-consistency", "langchain", "langgraph", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "langchain>=0.2.0",
    "langchain-core>=0.2.0",
    "langgraph>=0.2.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
vertex = ["langchain-google-genai>=4.0.0"]
a2a = ["fastapi>=0.100.0", "uvicorn>=0.23.0", "httpx>=0.24.0"]
dev = ["pytest>=7.0.0", "pytest-cov>=4.0.0"]
all = ["react-usc[vertex,a2a,dev]"]

[project.urls]
Homepage = "https://github.com/react-usc/react-usc"
Documentation = "https://github.com/react-usc/react-usc#readme"
Repository = "https://github.com/react-usc/react-usc"

[tool.hatch.build.targets.wheel]
packages = ["src/react_usc"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/examples",
    "/README.md",
    "/LICENSE",
]

[tool.hatch.version]
path = "src/react_usc/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
